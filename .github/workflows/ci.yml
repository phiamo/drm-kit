name: CI

on:
  push:
    branches: [main, feature/vod-drm]
    tags: ['v*']
  pull_request:
    branches: [main, feature/vod-drm]

jobs:
  test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install "platforms;android-36"
      - run: cd android && ./gradlew test

  test-ios:
    name: test-ios (iOS ${{ matrix.ios }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Floor iOS 15 (iPhone 7, 15.8.5): Apple no longer serves the iOS 15 simulator runtime for
          # download, so CI builds against the iOS 15 deployment target; run tests on the device.
          - { ios: '15', runner: macos-15, xcode: 'latest-stable', build_only: true }
          - { ios: '16', runner: macos-14, xcode: '16.2' }
          - { ios: '17', runner: macos-14, xcode: '16.2' }
          - { ios: '18', runner: macos-15, xcode: 'latest-stable' }
          - { ios: '26', runner: macos-15, xcode: 'latest-stable' }
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Build for the iOS ${{ matrix.ios }} deployment target
        if: matrix.build_only
        run: |
          grep -q '.iOS(.v${{ matrix.ios }})' Package.swift
          xcodebuild build-for-testing -scheme DrmKit -destination 'generic/platform=iOS Simulator' -skipMacroValidation
      - name: Build the FairPlay pilot app for the iOS ${{ matrix.ios }} deployment target
        if: matrix.build_only
        run: |
          grep -q 'IPHONEOS_DEPLOYMENT_TARGET = ${{ matrix.ios }}.0;' pilot/DrmKitPilot.xcodeproj/project.pbxproj
          xcodebuild build -project pilot/DrmKitPilot.xcodeproj -scheme DrmKitPilot -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -skipMacroValidation
      - name: Ensure an iOS ${{ matrix.ios }} simulator
        if: ${{ !matrix.build_only }}
        id: sim
        run: .github/scripts/ios-simulator.sh "${{ matrix.ios }}" >> "$GITHUB_OUTPUT"
      - if: ${{ !matrix.build_only }}
        run: xcodebuild test -scheme DrmKit -destination "id=${{ steps.sim.outputs.udid }}" -skipMacroValidation
