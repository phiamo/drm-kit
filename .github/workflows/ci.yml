name: CI

on:
  push:
    branches: [main, feature/vod-drm]
    tags: ['v*']
  pull_request:
    branches: [main, feature/vod-drm]

jobs:
  test-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - run: sdkmanager --install "platforms;android-36"
      - run: cd android && ./gradlew test

  test-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Resolve available iPhone simulator
        id: sim
        run: |
          DEST=$(xcrun simctl list devices available | grep -oE 'iPhone [0-9]+ \([0-9A-F-]+\)' | head -1 | sed -E 's/ \([0-9A-F-]+\)//')
          RUNTIME=$(xcrun simctl list runtimes | grep -oE 'iOS [0-9]+\.[0-9]+' | tail -1 | awk '{print $2}')
          echo "name=$DEST" >> "$GITHUB_OUTPUT"
          echo "os=$RUNTIME" >> "$GITHUB_OUTPUT"
          echo "Using simulator: $DEST / iOS $RUNTIME"
      - run: xcodebuild test -scheme DrmKit -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }},OS=${{ steps.sim.outputs.os }}" -skipMacroValidation
